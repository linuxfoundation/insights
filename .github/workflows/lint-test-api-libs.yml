name: Test API and Libs

on:
  pull_request:
    paths:
      - "api/**"
      - "libs/**"
      - "workers/api-gateway/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  lint-test-api-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.2

      - name: Install dependencies
        run: pnpm install --filter @lfx-insights/api... --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client --filter @lfx-insights/types --filter @lfx-insights/api-gateway

      - name: Build workspace libs
        run: pnpm --filter @lfx-insights/types --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client build

      - name: Type check
        run: pnpm --filter @lfx-insights/api --filter @lfx-insights/types --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client --filter @lfx-insights/api-gateway tsc-check

      - name: Build API
        run: pnpm --filter @lfx-insights/api build

      - name: Test
        run: pnpm --filter @lfx-insights/api --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client --filter @lfx-insights/api-gateway test
