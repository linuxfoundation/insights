name: Run Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.2

      - name: Install dependencies
        run: pnpm install --filter lfx-insights... --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client --filter @lfx-insights/types

      - name: Build workspace libs
        run: pnpm --filter @lfx-insights/types --filter @lfx-insights/postgres-client --filter @lfx-insights/tinybird-client build

      - name: Run tests
        env:
          NUXT_TINYBIRD_BASE_URL: https://tb.lf.org/
          NUXT_TINYBIRD_TOKEN: arandomtoken
        run: pnpm vitest
        working-directory: frontend
