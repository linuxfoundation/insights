name: Run Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Install dependencies
        run: pnpm install --filter lfx-insights... --filter @lfx-insights/tinybird-client --filter @lfx-insights/types

      - name: Build workspace libs
        run: pnpm --filter @lfx-insights/types --filter @lfx-insights/tinybird-client build

      - name: Run tests
        env:
          NUXT_TINYBIRD_BASE_URL: https://tb.lf.org/
          NUXT_TINYBIRD_TOKEN: arandomtoken
        run: pnpm vitest
        working-directory: frontend
